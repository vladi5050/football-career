<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <title>רגעי מפתח – דמו</title>
  <style>
    html,body{margin:0;height:100%;background:#0b0f19;color:#e8eefc;font-family:Heebo,system-ui,sans-serif}
    #panel{position:fixed;inset-inline-start:0;top:0;bottom:0;width:260px;padding:12px;box-sizing:border-box;overflow:auto;background:#121a2b;border-inline-end:1px solid #22304d;font-size:14px;z-index:5}
    #panel h1{font-size:17px;margin:0 0 10px}
    #panel label{display:flex;align-items:center;gap:6px;margin:6px 0}
    #panel select,#panel input[type=range]{width:100%}
    #panel button{width:100%;padding:10px;margin-top:8px;font-size:16px;font-weight:800;border:0;border-radius:10px;background:#ffd84a;color:#111;cursor:pointer}
    #panel button.sec{background:#2a3a5c;color:#fff;font-weight:600}
    #log{font-size:12px;white-space:pre-wrap;margin-top:10px;opacity:.85;direction:ltr;text-align:left}
    #stage{position:fixed;top:0;bottom:0;inset-inline-start:260px;inset-inline-end:0;display:flex;align-items:center;justify-content:center}
    #host{width:390px;height:844px;max-height:100vh;position:relative;background:#0c1220;border-radius:22px;overflow:hidden;box-shadow:0 0 0 8px #1b2438,0 20px 60px rgba(0,0,0,.6)}
    body.bare #panel{display:none}
    body.bare #stage{inset:0}
    body.bare #host{width:100vw;height:100vh;border-radius:0;box-shadow:none;max-height:none}
    #idle{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#7d8aa8;font-size:15px;text-align:center;padding:30px}
  </style>
</head>
<body>
  <div id="panel">
    <h1>רגעי מפתח – דמו</h1>
    <label>סוג רגע <select id="kind"></select></label>
    <label><input type="checkbox" id="lateClose" /> דקות הכרעה (lateClose)</label>
    <label><input type="checkbox" id="hostileCrowd" /> קהל עוין</label>
    <label><input type="checkbox" id="rivalInvolved" /> היריב מולך</label>
    <label><input type="checkbox" id="rain" /> גשם</label>
    <label><input type="checkbox" id="derby" /> דרבי</label>
    <label><input type="checkbox" id="asKeeper" /> פנדל כשוער</label>
    <label><input type="checkbox" id="reducedMotion" /> הפחתת תנועה</label>
    <label>קושי <input type="range" id="difficulty" min="0" max="1" step="0.05" value="0.5" /></label>
    <label>יכולת <input type="range" id="skill" min="1" max="99" step="1" value="65" /></label>
    <button id="play">שחק ▶</button>
    <button id="skip" class="sec">דלג (moment-skip)</button>
    <button id="all" class="sec">5 ברצף (בדיקת דליפות)</button>
    <div id="log"></div>
  </div>
  <div id="stage"><div id="host"><div id="idle">בחר רגע ולחץ "שחק"</div></div></div>
  <script type="module" src="./demo.ts"></script>
</body>
</html>
